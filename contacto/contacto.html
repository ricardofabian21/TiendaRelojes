<div class="contacto">

    <h2>CONTACTO</h2>

    <p class="intro">¿Dudas sobre un producto o un pedido? Escríbenos.</p>

    <form id="formContacto">

        <p>Nombre completo</p>
        <input type="text" id="nombreContacto" maxlength="100">
        <span class="error" id="errorNombre"></span>

        <p>Correo</p>
        <input type="text" id="correoContacto" maxlength="100">
        <span class="error" id="errorCorreo"></span>

        <p>Comentario</p>
        <textarea id="comentarioContacto" maxlength="500"></textarea>
        <span class="error" id="errorComentario"></span>

        <br><br>

        <button type="button" onclick="enviarMensajeContacto()">Enviar mensaje</button>

        <p class="exito" id="mensajeExito">Mensaje enviado. Te responderemos pronto.</p>

    </form>

</div>
