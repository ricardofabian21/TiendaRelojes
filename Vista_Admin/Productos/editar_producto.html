<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
 
    <table class="menu-admin">
        <tr>
            <td><h2>ADMINISTRADOR</h2></td>
        </tr>
        <tr>
            <td><a href="../../admin/home.html">Inicio</a></td>
        </tr>
        <tr>
            <td><a href="Producto_admin.html">Productos</a></td>
        </tr>
        <tr>
            <td><a href="../usuarios/Usuario_admin.html">Usuarios</a></td>
        </tr>
        <tr>
            <td><a href="../../login/login.html">Cerrar Sesión</a></td>
        </tr>
    </table>
 
    <div class="registro">
        <h2>Editar Producto</h2>
 
        <p>Selecciona el producto a editar</p>
        <select id="selectProductoEditar" onchange="cargarProductoParaEditar(this.value)"></select>
 
        <form onsubmit="return false;">
 
            <input type="hidden" id="idProductoEditar">
 
            <p>Nombre del producto</p>
            <input type="text" id="nombreEditarProducto" maxlength="80">
 
            <p>Precio (sin puntos, ej: 199990)</p>
            <input type="number" id="precioEditarProducto" min="0">
 
            <p>Descripción</p>
            <input type="text" id="descripcionEditarProducto" maxlength="300">
 
            <p>Ruta de la imagen (ej: img/productos/nombre.png)</p>
            <input type="text" id="imagenEditarProducto" maxlength="200">
 
            <br><br>
 
            <button type="button" onclick="guardarEdicionProducto()">Guardar Cambios</button>
 
        </form>
 
        <br>
    </div>
 
    <script src="../../js/script.js"></script>
</body>
</html>
