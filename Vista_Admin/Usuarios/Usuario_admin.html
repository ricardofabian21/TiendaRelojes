<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario Admin - Chronos</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    
    <table class="menu-admin-horizontal">
        <tr>
            <td><h2>ADMINISTRADOR</h2></td>
            <td><a href="../../admin/home.html">Inicio</a></td>
            <td><a href="../Productos/Producto_admin.html">Productos</a></td>
            <td><a href="Usuario_admin.html">Usuarios</a></td>
            <td><a href="../login/login.html">Cerrar Sesión</a></td>
        </tr>
    </table>

    <div class="administrador">
        <h1>Bienvenid@ <span id="nombreUsuario" style="color: gold;">Admin</span></h1>
        
        <p>Gestión de usuarios y sistema</p>

       
        <div class="panel-botones-admin">
            <button onclick="window.location.href='Nuevo_Usuario/nuevo_usuario.html'">Crear Usuario</button>
            <button onclick="editarUsuarioPrompt()">Editar Usuarios</button>
            <button onclick="window.location.href='Mostrar_Usuario/mostrar_usuario.html'">Listar Usuarios</button>
        </div>
    </div>

   
    <script src="../../js/script.js"></script>
    
   
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let sesion = localStorage.getItem("usuarioSesion");
            if (sesion) {
                let usuario = JSON.parse(sesion);
                document.getElementById("nombreUsuario").textContent = usuario.nombre;
            }
        });
    </script>
</body>
</html>
