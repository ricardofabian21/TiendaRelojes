</head>
<body>

    <table class="menu-admin">

        </tr>
    </table>

    <div class="registro">

        <h2>EDITAR USUARIO</h2>

        <form>

            <p>Selecciona un usuario</p>
            <select id="selectUsuarioEditar" onchange="cargarUsuarioParaEditar(this.value)"></select>

            <input type="hidden" id="idUsuarioEditar">

            <p>Nombre</p>
            <input type="text" id="nombreEditarUsuario">

            <p>Apellido</p>
            <input type="text" id="apellidoEditarUsuario">

            <p>Correo</p>
            <input type="text" id="correoEditarUsuario">

            <p>Contraseña</p>
            <input type="password" id="contrasenaEditarUsuario">

            <br><br>

            <button type="button" onclick="guardarEdicionUsuario()">Guardar Cambios</button>
            <button type="button" onclick="window.location.href='../Mostrar_Usuario/mostrar_usuario.html'">Cancelar</button>

        </form>

    </div>

    <script src="../../../js/script.js"></script>
</body>
</html>
